name: Payyap Mobile Automation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run WebdriverIO tests
        run: npx wdio run wdio.conf.js --spec ./test/specs/TC01_LoginHome.e2e.js
 